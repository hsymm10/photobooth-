<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photobooth Neubrutalism</title>
    <link
      rel="shortcut icon"
      href="assets/images/icons/favicon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <!-- Landing Page -->
    <section id="landing-page" class="view active">
      <div class="hero-scene">
        <div class="floating-card card-left">
          <img
            src="assets/images/icons/frames/1.png"
            alt="Frame sample"
          />
        </div>
        <div class="floating-card card-right">
          <img
            src="assets/images/icons/frames/2.png"
            alt="Frame sample"
          />
        </div>
        <div class="floating-card card-bottom-left">
          <img
            src="assets/images/icons/frames/3.png"
            alt="Frame sample"
          />
        </div>

        <div class="hero-card">
          <img
            class="brand-icon"
            src="assets/images/icons/no-bg-icon.png"
            alt="Photobooth icon"
          />
          <h1>
            Editor Foto AI<br />
            <span>Gratis untuk</span><br />
            <span class="line-break">Setiap Ide</span>
          </h1>
          <p>
            Abadikan momen serumu secara instant dengan frame yang terlihat
            langsung di kamera.
          </p>

          <div class="hero-actions">
            <button class="btn-primary" onclick="switchView('booth-page')">
              Mulai Foto
            </button>
            <button class="btn-secondary" onclick="switchView('gallery-page')">
              Lihat Galeri
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Photobooth Page -->
    <section id="booth-page" class="view">
      <button class="back-btn" onclick="switchView('landing-page')">
        ← Kembali
      </button>

      <div class="booth-shell">
        <div class="studio-toolbar">
          <div class="timer-switcher">
            <button class="time-chip active" type="button" data-seconds="3">
              3s
            </button>
            <button class="time-chip" type="button" data-seconds="5">5s</button>
            <button class="time-chip" type="button" data-seconds="10">
              10s
            </button>
          </div>

          <div class="layout-selector">
            <label>Grid</label>
            <div class="chip-group">
              <button class="chip-option active" type="button" data-value="2">
                2 Foto
              </button>
              <button class="chip-option" type="button" data-value="4">
                4 Foto
              </button>
              <button class="chip-option" type="button" data-value="8">
                8 Foto
              </button>
            </div>
          </div>

          <div class="filter-selector">
            <label>Filter</label>
            <div id="filter-select" class="filter-grid">
              <button
                class="filter-option active"
                type="button"
                data-value="none"
              >
                Normal
              </button>
              <button
                class="filter-option"
                type="button"
                data-value="grayscale(100%)"
              >
                Mono
              </button>
              <button
                class="filter-option"
                type="button"
                data-value="sepia(100%)"
              >
                Sepia
              </button>
              <button
                class="filter-option"
                type="button"
                data-value="contrast(150%)"
              >
                High
              </button>
              <button
                class="filter-option"
                type="button"
                data-value="saturate(200%)"
              >
                Bright
              </button>
            </div>
          </div>
        </div>

        <div class="capture-stage">
          <div class="preview-panel">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="preview-canvas" aria-hidden="true"></canvas>
            <div id="countdown-overlay"></div>
          </div>
          <div class="thumb-stack">
            <div class="mini-thumb selected">
              <img
                src="assets/images/icons/frames/1.png"
                alt="Current thumb"
              />
            </div>
            <div class="mini-thumb">
              <img
                src="assets/images/icons/frames/2.png"
                alt="Current thumb"
              />
            </div>
            <div class="mini-thumb">
              <img
                src="assets/images/icons/frames/3.png"
                alt="Current thumb"
              />
            </div>
          </div>
        </div>
        <button
          id="start-btn"
          class="btn-primary capture-btn"
          onclick="startCaptureProcess()"
        >
          Ambil Foto
        </button>
      </div>
    </section>

    <div id="frame-picker-modal" class="modal">
      <div class="modal-content frame-picker-content">
        <span class="close-btn" onclick="closeFramePicker()">&times;</span>
        <h3>Pilih Frame</h3>
        <div id="frame-picker-grid" class="frame-grid"></div>
      </div>
    </div>

    <!-- Gallery Page -->
    <section id="gallery-page" class="view">
      <button class="back-btn" onclick="switchView('landing-page')">
        ← Kembali
      </button>
      <h2>Galeri Foto</h2>

      <div class="gallery-actions">
        <button class="btn-primary" onclick="downloadSelectedQR()">
          Generate QR Code
        </button>
        <button class="btn-secondary" onclick="selectAll(true)">
          Pilih Semua
        </button>
        <button class="btn-secondary" onclick="selectAll(false)">
          Batal Pilih
        </button>
        <button class="btn-danger" onclick="deleteSelectedPhotos()">
          Hapus Terpilih
        </button>
      </div>

      <div id="gallery-grid" class="gallery-grid"></div>
    </section>

    <!-- Modal QR Code -->
    <div id="qr-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3>Scan QR Code</h3>
        <div id="qrcode"></div>
        <p>Scan untuk mengunduh gambar hasil akhir</p>
      </div>
    </div>

    <canvas id="hidden-canvas" style="display: none"></canvas>
    <script src="assets/js/app.js"></script>
  </body>
</html>
